name: Build Similarity Cache

permissions:
  contents: write
  issues: write

# Manual trigger + weekly schedule + callable from other workflows
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if cache exists'
        required: false
        type: boolean
        default: true
  workflow_call:  # Allow this workflow to be called by other workflows
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Check if cache needs rebuild
        id: check_cache
        run: |
          FORCE="${{ github.event.inputs.force_rebuild }}"
          if [ "$FORCE" = "true" ] || [ ! -f "card_files/similarity_cache.parquet" ]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "Cache doesn't exist or force rebuild requested"
          else
            # Check cache age via metadata JSON
            CACHE_AGE_DAYS=$(python -c "
          import json
          from datetime import datetime
          from pathlib import Path
          
          metadata_path = Path('card_files/similarity_cache_metadata.json')
          if metadata_path.exists():
              with open(metadata_path) as f:
                  data = json.load(f)
              build_date = data.get('build_date')
              if build_date:
                  age = (datetime.now() - datetime.fromisoformat(build_date)).days
                  print(age)
              else:
                  print(999)
          else:
              print(999)
          " || echo "999")
            
            if [ "$CACHE_AGE_DAYS" -gt 7 ]; then
              echo "needs_build=true" >> $GITHUB_OUTPUT
              echo "Cache is $CACHE_AGE_DAYS days old, rebuilding"
            else
              echo "needs_build=false" >> $GITHUB_OUTPUT
              echo "Cache is only $CACHE_AGE_DAYS days old, skipping"
            fi
          fi
      
      - name: Create temporary build branch
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          # Create a unique temporary branch for this build
          TEMP_BRANCH="temp-cache-build-${{ github.run_id }}"
          echo "TEMP_BRANCH=$TEMP_BRANCH" >> $GITHUB_ENV
          git checkout -b $TEMP_BRANCH
          echo "Created temporary branch: $TEMP_BRANCH"
      
      - name: Run initial setup
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          python -c "from code.file_setup.setup import initial_setup; initial_setup()"
      
      - name: Build token/emblem catalog
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          # Must run before tagging so tag_for_tokens() can consult the catalog's
          # relatedCards reverse index (see roadmap_39, Milestone 1/2).
          python -c "
          import os
          from code.file_setup.setup import download_parquet_from_mtgjson, MTGJSON_TOKENS_PARQUET_URL
          from code.file_setup.token_setup import build_tokens_parquet, tag_token_catalog_own_fields
          from code.file_setup.data_loader import DataLoader
          from code.path_util import card_files_raw_dir, card_files_processed_dir

          raw_tokens_path = os.path.join(card_files_raw_dir(), 'tokens.parquet')
          if not os.path.exists(raw_tokens_path):
              print('Downloading MTGJSON tokens.parquet...')
              download_parquet_from_mtgjson(raw_tokens_path, url=MTGJSON_TOKENS_PARQUET_URL, desc='Downloading tokens.parquet')

          tokens_path = os.path.join(card_files_processed_dir(), 'tokens.parquet')
          tokens_df = build_tokens_parquet(raw_path=raw_tokens_path, output_path=tokens_path)
          tokens_df = tag_token_catalog_own_fields(tokens_df)
          DataLoader().write_cards(tokens_df, tokens_path)
          print(f'Token/emblem catalog built: {len(tokens_df)} rows')
          "
          if [ ! -f "card_files/processed/tokens.parquet" ]; then
            echo "WARNING: Token/emblem catalog not created (non-fatal, tokens will be unavailable)"
          else
            echo "✓ Token/emblem catalog built"
          fi
      
      - name: Run tagging (serial for CI reliability)
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          # Note: Theme stripping now runs automatically after tagging
          # If THEME_MIN_CARDS > 1, this will:
          #   1. Strip low-card themes from parquet themeTags
          #   2. Rebuild theme_list.json from stripped data
          #   3. Strip catalog YAML files
          #   4. Update logs/stripped_themes.yml log
          python -c "from code.tagging.tagger import run_tagging; run_tagging(parallel=False)"
          
          # Verify tagging completed
          if [ ! -f "card_files/processed/.tagging_complete.json" ]; then
            echo "ERROR: Tagging completion flag not found"
            exit 1
          fi
      
      - name: Apply emblem backreferences
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          # Writes 'Emblem: {creator}' metadataTags + 'Emblem' themeTag onto each
          # emblem's creator card(s); must run after tagging (freshly-tagged save).
          python -c "
          import os
          import pandas as pd
          from code.file_setup.token_setup import apply_emblem_backreferences
          from code.file_setup.data_loader import DataLoader
          from code.path_util import card_files_processed_dir, get_processed_cards_path

          processed_path = get_processed_cards_path()
          tokens_path = os.path.join(card_files_processed_dir(), 'tokens.parquet')
          if os.path.exists(processed_path) and os.path.exists(tokens_path):
              all_cards_df = pd.read_parquet(processed_path)
              tokens_df = pd.read_parquet(tokens_path)
              all_cards_df = apply_emblem_backreferences(all_cards_df, tokens_df)
              DataLoader().write_cards(all_cards_df, processed_path)
              print('Emblem backreferences applied')
          else:
              print('Skipping emblem backreferences (all_cards.parquet or tokens.parquet missing)')
          " || echo "WARNING: Emblem backreference step failed (non-fatal)"
      
      # File an issue for any unregistered Rulebreaker
      # candidate found during tagging. Best-effort only; never fails the job.
      - name: File issues for unrecognized Rulebreaker candidates
        if: steps.check_cache.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          rm -rf _rb_candidates && mkdir -p _rb_candidates
          python -c "
          import json
          from pathlib import Path

          path = Path('logs/rulebreaker_candidates.json')
          if not path.exists():
              print('No rulebreaker_candidates.json found, skipping.')
              raise SystemExit(0)

          candidates = json.loads(path.read_text(encoding='utf-8'))
          if not candidates:
              print('No unrecognized Rulebreaker candidates found.')
              raise SystemExit(0)

          from code.tagging.rulebreaker_report import build_candidate_issue_body

          out_dir = Path('_rb_candidates')
          manifest_lines = []
          for i, c in enumerate(candidates):
              name = c.get('name', '')
              title = f'Rulebreaker: {name}'
              body = build_candidate_issue_body(c)
              (out_dir / f'{i}.md').write_text(body, encoding='utf-8')
              manifest_lines.append(f'{i}\t{title}')
              print(f'::notice::Candidate found: {name}')
          (out_dir / 'manifest.tsv').write_text('\n'.join(manifest_lines), encoding='utf-8')
          "

          # One issue per candidate, deduped against existing open/closed issues
          # by exact title search (kept in shell so gh auth/search stays simple
          # and any single failure here is non-fatal to the overall job).
          if [ -f _rb_candidates/manifest.tsv ]; then
            while IFS=$'\t' read -r idx title; do
              [ -z "$title" ] && continue
              existing=$(gh issue list --search "\"$title\" in:title" --state all --json number --jq '.[0].number' 2>/dev/null)
              if [ -n "$existing" ]; then
                echo "Issue already exists for '$title' (#$existing), skipping."
                continue
              fi
              gh issue create --title "$title" --body-file "_rb_candidates/${idx}.md" --label enhancement,rulebreaker \
                || echo "WARNING: failed to create issue for '$title' (non-fatal)"
            done < _rb_candidates/manifest.tsv
          fi
          rm -rf _rb_candidates
          set -e
      
      - name: Refresh price data and write to parquet
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          # refresh_prices_parquet() downloads fresh Scryfall bulk data and rebuilds the cache
          python -c "from code.file_setup.setup import refresh_prices_parquet; refresh_prices_parquet(print)"
          
          if [ ! -f "card_files/prices_cache.json" ]; then
            echo "ERROR: Price cache not created"
            exit 1
          fi
          echo "Price data refreshed successfully"
      
      # Debug step - uncomment if needed to inspect Parquet file contents
      # - name: Debug - Inspect Parquet file after tagging
      #   if: steps.check_cache.outputs.needs_build == 'true'
      #   run: |
      #     python -c "
      #     import pandas as pd
      #     from pathlib import Path
      #     from code.path_util import get_processed_cards_path
      #     
      #     parquet_path = Path(get_processed_cards_path())
      #     print(f'Reading Parquet file: {parquet_path}')
      #     print(f'File exists: {parquet_path.exists()}')
      #     
      #     if not parquet_path.exists():
      #         raise FileNotFoundError(f'Parquet file not found: {parquet_path}')
      #     
      #     df = pd.read_parquet(parquet_path)
      #     print(f'Loaded {len(df)} rows from Parquet file')
      #     print(f'Columns: {list(df.columns)}')
      #     print('')
      #     
      #     # Show first 5 rows completely
      #     print('First 5 complete rows:')
      #     print('=' * 100)
      #     for idx, row in df.head(5).iterrows():
      #         print(f'Row {idx}:')
      #         for col in df.columns:
      #             value = row[col]
      #             if isinstance(value, (list, tuple)) or hasattr(value, '__array__'):
      #                 # For array-like, show type and length
      #                 try:
      #                     length = len(value)
      #                     print(f'  {col}: {type(value).__name__}[{length}] = {value}')
      #                 except:
      #                     print(f'  {col}: {type(value).__name__} = {value}')
      #             else:
      #                 print(f'  {col}: {value}')
      #         print('-' * 100)
      #     "
      
      - name: Generate theme catalog
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          if [ ! -f "config/themes/theme_catalog.csv" ]; then
            echo "Theme catalog not found, generating..."
            python -m code.scripts.generate_theme_catalog
          else
            echo "Theme catalog already exists, skipping generation"
          fi
      
      - name: Verify theme catalog and tag statistics
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          # Detailed check of what tags were actually written
          python -c "
          import pandas as pd
          from code.path_util import get_processed_cards_path
          df = pd.read_parquet(get_processed_cards_path())
          
          # Helper to count tags (handles both list and numpy array)
          def count_tags(x):
              if x is None:
                  return 0
              if hasattr(x, '__len__'):
                  try:
                      return len(x)
                  except:
                      return 0
              return 0
          
          # Count total tags
          total_tags = 0
          cards_with_tags = 0
          sample_cards = []
          
          for idx, row in df.head(10).iterrows():
              name = row['name']
              tags = row['themeTags']
              tag_count = count_tags(tags)
              total_tags += tag_count
              if tag_count > 0:
                  cards_with_tags += 1
                  sample_cards.append(f'{name}: {tag_count} tags')
          
          print(f'Sample of first 10 cards:')
          for card in sample_cards:
              print(f'  {card}')
          
          # Full count
          all_tags = df['themeTags'].apply(count_tags).sum()
          all_with_tags = (df['themeTags'].apply(count_tags) > 0).sum()
          
          print(f'')
          print(f'Total cards: {len(df):,}')
          print(f'Cards with tags: {all_with_tags:,}')
          print(f'Total theme tags: {all_tags:,}')
          
          if all_tags < 10000:
              raise ValueError(f'Only {all_tags} tags found, expected >10k')
          "
      
      - name: Build similarity cache (Parquet) from card_files/processed/all_cards.parquet
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          python -m code.scripts.build_similarity_cache_parquet --parallel --checkpoint-interval 1000 --force
      
      - name: Build rulings cache from Scryfall bulk data
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          python -c "from code.file_setup.rulings_cache import build_rulings_cache; build_rulings_cache(output_func=print)"
          if [ ! -f "card_files/processed/rulings_cache.json" ]; then
            echo "WARNING: Rulings cache not created (non-fatal, live fallback will be used)"
          else
            echo "✓ Rulings cache built"
          fi
      
      - name: Build art tags cache from Scryfall bulk data
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          python -c "from code.file_setup.art_tags_cache import build_art_tags_cache; build_art_tags_cache(output_func=print)" || echo "WARNING: Art tags cache build failed (non-fatal, artTags column will be missing/empty)"
      
      - name: Build printings index (Choose Printing feature)
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          python -c "from code.file_setup.image_cache import ImageCache; ImageCache().build_printings_index()"
          if [ ! -f "card_files/processed/card_printings.parquet" ]; then
            echo "WARNING: Printings index not created (non-fatal, on-demand fetch will be used)"
          else
            echo "✓ Printings index built"
          fi
      
      - name: Build token/emblem printings index (Choose Printing feature)
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          python -c "
          import os
          from code.file_setup.image_cache import ImageCache
          from code.file_setup.data_loader import DataLoader
          from code.path_util import card_files_processed_dir

          tokens_path = os.path.join(card_files_processed_dir(), 'tokens.parquet')
          if os.path.exists(tokens_path):
              tokens_df = DataLoader().read_cards(tokens_path)
              count = ImageCache().build_token_printings_index(tokens_df)
              print(f'Token/emblem printings index built: {count} rows')
          else:
              print('Skipping token printings index (tokens.parquet missing)')
          " || echo "WARNING: Token/emblem printings index not created (non-fatal)"
      
      - name: Verify cache was created
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          if [ ! -f "card_files/similarity_cache.parquet" ]; then
            echo "ERROR: Similarity cache not created"
            exit 1
          fi
          if [ ! -f "card_files/similarity_cache_metadata.json" ]; then
            echo "ERROR: Similarity cache metadata not created"
            exit 1
          fi
          if [ ! -f "card_files/processed/commander_cards.parquet" ]; then
            echo "ERROR: Commander cache not created"
            exit 1
          fi
          
          # Rulings cache is non-fatal (live fallback available)
          if [ ! -f "card_files/processed/rulings_cache.json" ]; then
            echo "WARNING: Rulings cache not created (live Scryfall fallback will be used)"
          fi
          
          # Printings index is non-fatal (on-demand per-image fetch fallback available)
          if [ ! -f "card_files/processed/card_printings.parquet" ]; then
            echo "WARNING: Printings index not created (Choose Printing feature will show no alternates)"
          fi
          
          # Token/emblem catalog + printings index are non-fatal (feature is additive)
          if [ ! -f "card_files/processed/tokens.parquet" ]; then
            echo "WARNING: Token/emblem catalog not created (tokens/emblems will be unavailable)"
          fi
          if [ ! -f "card_files/processed/token_printings.parquet" ]; then
            echo "WARNING: Token/emblem printings index not created (token Choose Printing feature will show no alternates)"
          fi
          
          echo "✓ All cache files created successfully"
      
      - name: Get cache metadata for commit message
        if: steps.check_cache.outputs.needs_build == 'true'
        id: cache_meta
        run: |
          METADATA=$(python -c "
          import json
          from pathlib import Path
          from code.web.services.similarity_cache import get_cache
          
          cache = get_cache()
          stats = cache.get_stats()
          metadata = cache._metadata or {}
          
          build_date = metadata.get('build_date', 'unknown')
          print(f\"{stats['total_cards']} cards, {stats['total_entries']} entries, {stats['file_size_mb']:.1f}MB, built {build_date}\")
          ")
          echo "metadata=$METADATA" >> $GITHUB_OUTPUT
      
      - name: Commit and push cache
        if: steps.check_cache.outputs.needs_build == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create a detached commit with just the cache files (no checkout needed)
          echo "Creating cache-only commit..."
          
          # Create README for the branch  
          cat > README-cache.md << 'EOF'
          # Similarity Cache Data
          This branch contains pre-built similarity cache files for the MTG Deckbuilder.
          Updated automatically by GitHub Actions.
          
          ## Files
          - `card_files/similarity_cache.parquet` - Pre-computed card similarity cache
          - `card_files/similarity_cache_metadata.json` - Cache metadata
          - `card_files/processed/all_cards.parquet` - Tagged card database (with prices)
          - `card_files/processed/commander_cards.parquet` - Commander-only cache (fast lookups)
          - `card_files/processed/.tagging_complete.json` - Tagging status
          - `card_files/prices_cache.json` - Scryfall price cache
          - `card_files/ck_prices_cache.json` - Card Kingdom price cache
          - `card_files/prices_cache.json.ts` - Per-card price timestamps (if present)
          - `card_files/processed/rulings_cache.json` - Official card rulings from Scryfall bulk data
          - `card_files/processed/card_printings.parquet` - Per-printing metadata index (set, collector number, art) for the Choose Printing feature
          - `card_files/processed/tokens.parquet` - Token/emblem catalog (canonical identities + creator card references)
          - `card_files/processed/token_printings.parquet` - Per-printing metadata index for token/emblem artwork (Choose Printing feature)
          EOF
          
          # Start with clean index
          git rm -rf --cached . > /dev/null 2>&1 || true
          
          # Add cache files to index (use -f to override .gitignore)
          git add -f card_files/similarity_cache.parquet
          git add -f card_files/similarity_cache_metadata.json
          git add -f card_files/processed/all_cards.parquet
          git add -f card_files/processed/commander_cards.parquet
          git add -f card_files/processed/.tagging_complete.json
          git add -f card_files/prices_cache.json
          git add -f card_files/ck_prices_cache.json 2>/dev/null || true
          git add -f card_files/prices_cache.json.ts 2>/dev/null || true
          git add -f card_files/processed/rulings_cache.json 2>/dev/null || true
          git add -f card_files/processed/card_printings.parquet 2>/dev/null || true
          git add -f card_files/processed/tokens.parquet 2>/dev/null || true
          git add -f card_files/processed/token_printings.parquet 2>/dev/null || true
          git add -f README-cache.md
          
          # Create a new commit
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree $TREE -m "chore: update similarity cache [${{ steps.cache_meta.outputs.metadata }}]")
          
          echo "Created commit: $COMMIT"
          
          # Push directly to similarity-cache-data branch (force push)
          git push origin $COMMIT:refs/heads/similarity-cache-data --force
          
          echo "Successfully pushed cache to similarity-cache-data branch"
      
      - name: Cleanup temporary branch
        if: always() && steps.check_cache.outputs.needs_build == 'true'
        run: |
          # Return to original branch and delete temporary branch
          git checkout ${{ github.ref_name }} 2>/dev/null || git checkout main
          git branch -D $TEMP_BRANCH 2>/dev/null || true
          echo "Cleaned up temporary branch: $TEMP_BRANCH"
      
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check_cache.outputs.needs_build }}" = "true" ]; then
            echo "✓ Similarity cache built and committed"
            echo "  Metadata: ${{ steps.cache_meta.outputs.metadata }}"
          else
            echo "⊘ Cache is recent, no rebuild needed"
          fi
